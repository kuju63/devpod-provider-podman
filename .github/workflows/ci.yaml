name: ci

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
      - name: Lint YAML files
        run: |
          yamllint provider.yaml
  run-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
            persist-credentials: false
      - name: Set up DevPod-CLI
        run: |
          curl --fail --location -L -o devpod "https://github.com/loft-sh/devpod/releases/download/v0.6.15/devpod-linux-amd64" && sudo install -c -m 0755 devpod /usr/local/bin && rm -f devpod
      - name: Setup Podman
        run: |
          sudo apt-get -q update
          sudo apt-get -q install -y podman
      - name: Run tests
        run: |
            bash tests/integration_test.sh
